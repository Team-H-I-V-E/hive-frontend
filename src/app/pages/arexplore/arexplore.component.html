<div class="custom-ar-page">
  <div id="location"> 
    <p>📍유저 위치: {{ userLatitude }}, {{ userLongitude }}</p>
    <p *ngFor="let stamp of stamps"> 🧭 스탬프 {{ stamp.stampID }} 위치: {{ stamp.stampLatitude }}, {{ stamp.stampLongitude }}</p>
  </div>
  
  <!-- AR.js 씬 -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <!-- GLB 모델을 각 스탬프 위치에 표시 -->
    <a-entity *ngFor="let stamp of stamps"
              [attr.gps-entity-place]="'latitude: ' + stamp.stampLatitude + '; longitude: ' + stamp.stampLongitude"
              gltf-model="/assets/models/seal.glb"
              scale="10 10 10"
              rotation="0 180 0">
    </a-entity>

    <!-- 카메라 설정 -->
    <a-camera gps-camera rotation-reader></a-camera>
  </a-scene>
</div>

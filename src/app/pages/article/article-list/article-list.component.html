<body style="background-color: #F7F6EC; min-height: 100vh; margin: 0;">

    <div class="container py-5">
        <div class="row gx-5 gy-5">
            <div class="col-12 col-sm-6 col-md-4" *ngFor="let article of articles">
                <div class="card h-100 shadow-sm border-0 rounded-4 overflow-hidden"
                    style="transition: all 0.3s ease; background: #fff;">

                    <!-- 이미지 캐러셀 -->
                    <div *ngIf="article.articleImages?.length" class="carousel slide"
                        [id]="'carousel-' + article.articleId">
                        <div class="carousel-inner">
                            <div class="carousel-item" *ngFor="let image of article.articleImages; let j = index"
                                [class.active]="j === 0">
                                <div class="ratio ratio-4x3 bg-light">
                                    <img [src]="environment.apiBaseUrl + '/uploads/article/' + image.articleImage"
                                        class="d-block w-100 h-100 object-fit-cover" alt="slide image">
                                </div>
                            </div>
                        </div>

                        <button class="carousel-control-prev" type="button"
                            [attr.data-bs-target]="'#carousel-' + article.articleId" data-bs-slide="prev">
                            <span class="carousel-control-prev-icon" style="width: 24px; height: 24px;"></span>
                        </button>
                        <button class="carousel-control-next" type="button"
                            [attr.data-bs-target]="'#carousel-' + article.articleId" data-bs-slide="next">
                            <span class="carousel-control-next-icon" style="width: 24px; height: 24px;"></span>
                        </button>
                    </div>

                    <!-- 카드 내용 -->
                    <div class="card-body p-3 d-flex flex-column justify-content-between">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="fw-bold small">{{ article.nickname || '알 수 없음' }}</span>
                            <div class="d-flex gap-2">
                                <i class="bi bi-heart fs-5 text-muted hover-primary" style="cursor: pointer;"></i>
                                <i class="bi bi-bookmark fs-5 text-muted hover-primary" style="cursor: pointer;"></i>
                            </div>
                        </div>

                        <h6 class="card-title text-dark mb-2">{{ article.articleTitle }}</h6>

                        <div class="d-flex justify-content-between align-items-center">
                            <small class="text-muted">{{ article.articleCreatedAt | date: 'longDate' }}</small>
                            <small class="text-primary">📍 세종특별자치시</small>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- 작성 버튼 -->
    <a routerLink="/article/write"
        class="btn rounded-circle position-fixed d-flex justify-content-center align-items-center"
        style="bottom: 2rem; right: 2rem; width: 72px; height: 72px; font-size: 28px; background-color: #785927; border: none; z-index: 1050; box-shadow: 0 6px 20px rgba(0,0,0,0.25);">
        <i class="bi bi-pencil" style="pointer-events: none; color: white;"></i>
    </a>

    <style>
        .hover-primary:hover {
            color: #5e4521 !important;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
    </style>

</body>

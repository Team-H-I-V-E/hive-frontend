<ion-header>
    <app-header></app-header>
</ion-header>

<ion-content>
    <div class="article-feed">
        <div class="article-list" *ngFor="let article of articles" (click)="goToDetail(article.articleId)">
            <div class="article-header">
                <img class="avatar" [src]="'assets/no-image.png'" alt="user" />
                <span class="username">User {{ article.userId || '알 수 없음' }}</span>
            </div>

            <div class="article-image" *ngIf="article.articleImages?.length">
                <img *ngIf="article.articleImages?.length"
                    [src]="environment.apiBaseUrl + article.articleImages[0].articleImage"
                    alt="article image" />
            </div>

            <div class="article-actions">
                <i class="icon-heart"></i>
                <i class="icon-comment"></i>
                <i class="icon-bookmark"></i>
            </div>

            <div class="article-caption">
                <strong>{{ article.articleTitle }}</strong>
                <p>{{ article.articleContents }}</p>
                <span class="date">{{ article.articleCreatedAt | date: 'longDate' }}</span>
            </div>

            <div class="article-location">📍 세종특별자치시</div>
        </div>
    </div>
</ion-content>

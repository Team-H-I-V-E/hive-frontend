<div class="w-100 py-5 heritage-wrapper" *ngIf="heritage">
  <div class="mx-auto heritage-card">
    <!-- 상단: 이미지 + 정보 -->
    <div class="row g-4">
      <!-- 좌측: 이미지 -->
      <div class="col-md-5 text-center">
        <img
          [src]="'assets/artifact.jpg'"
          alt="유물 이미지"
          class="img-fluid rounded shadow-sm"
          style="max-height: 400px; object-fit: contain"
        />
      </div>

      <!-- 우측: 정보 -->
      <div class="col-md-7">
        <!-- 제목 -->
        <h4 class="fw-bold mb-1">{{ heritage.heritageName }}</h4>
        <p class="text-muted" style="font-style: italic; font-size: 15px">
          Buddhist Stele with Inscription of "Muin Year" and Pedestal at
          Yeonhwasa Temple, Sejong
        </p>

        <!-- 정보 테이블 -->
        <table class="table table-sm table-borderless" style="font-size: 15px">
          <tbody>
            <tr>
              <th class="text-secondary fw-normal" style="width: 120px">
                시대
              </th>
              <td>보물</td>
            </tr>
            <tr>
              <th class="text-secondary fw-normal">시대</th>
              <td>통일신라시대</td>
            </tr>
            <tr>
              <th class="text-secondary fw-normal">분류</th>
              <td>유물 / 불교 조각 / 석조 / 대좌</td>
            </tr>
            <tr>
              <th class="text-secondary fw-normal">수량/면적</th>
              <td>1좌</td>
            </tr>
            <tr>
              <th class="text-secondary fw-normal">지정(등록)일</th>
              <td>1978. 12. 07</td>
            </tr>
            <tr>
              <th class="text-secondary fw-normal">소재지</th>
              <td>세종특별자치시 연화사길 28-1 (월하리)</td>
            </tr>
          </tbody>
        </table>

        <!-- 3D View 버튼 -->
        <div class="text-end mb-3">
          <button
            class="btn btn-outline-secondary btn-sm"
            (click)="view3DModel()"
          >
            <i class="bi bi-box"></i> 3D View
          </button>
        </div>

        <!-- 3D 모델 뷰어 (토글 표시) -->
          <div
            #rendererContainer
            class="viewer-container"
            style="
              height: 400px;
              width: 100%;
              background-color: #f0f0f0;
              border: 1px solid #ddd;
            "
          ></div>
        </div>
      </div>
      <!-- 우측 정보 col 종료 -->
    </div>
    <!-- row 종료 -->

    <!-- 설명 영역: row 바깥으로 빼서 전체 너비 -->
    <div class="mt-5">
      <h5 class="fw-semibold mb-3">Cultural Heritage Description</h5>
      <p class="text-secondary" style="line-height: 1.8; white-space: pre-line">
        {{ heritage.heritageDescription }}
      </p>
    </div>

    <!-- 지도 영역: row 바깥으로 빼서 전체 너비 -->
    <div class="mt-5">
      <h5 class="fw-semibold mb-3">Location</h5>
      <div
        id="map"
        class="heritage-map rounded shadow-sm"
        style="width: 100%; height: 350px"
      ></div>
    </div>
  </div>

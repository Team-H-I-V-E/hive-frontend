<style>
  @media (max-width: 768px) {
    .panorama-sidebar {
      width: 100vw !important;
      min-width: 100vw !important;
      flex: 0 0 100vw !important;
      z-index: 1050 !important;
      /* 모바일에서 필터보다 위에 표시 */
    }

    .era-filter-mobile {
      z-index: 1000 !important;
      /* 필터는 더 아래에 표시 */
    }
  }
</style>

<div class="d-flex flex-column p-0" style="height: calc(100vh - 80px);">
  <!-- panorama 전체 wrapper -->

  <div class="d-flex flex-grow-1 position-relative" style="height: 100%;">
    <!-- 지도 + 사이드바를 담는 컨테이너 -->

    <!-- 디테일 사이드바 -->
    <div *ngIf="selectedPanorama" class="d-flex flex-column bg-light border-end panorama-sidebar"
      style="width: 450px; height: 100%;">
      <div style="flex: 0 0 auto;">
        <!-- 헤더 영역 -->
      </div>

      <div class="overflow-auto" style="flex: 1 1 auto;">
        <app-panorama-detail [panorama]="selectedPanorama" (close)="closeSidebar()"></app-panorama-detail>
      </div>
    </div>

    <!-- 지도 영역 -->
    <div class="flex-grow-1 position-relative" style="height: 100%;">
      <div id="map" class="w-100 h-100"></div>

      <!-- 시대 필터 버튼 (모바일 포함) -->
      <div class="position-absolute top-50 end-0 translate-middle-y d-flex flex-column gap-2 me-3 era-filter-mobile"
        style="z-index: 1000;">
        <button *ngFor="let era of eras" (click)="selectEra(era)" class="btn btn-light rounded-pill py-2 px-3"
          [class.active]="selectedEra === era">
          {{ era }}
        </button>
        <button (click)="selectEra('')" class="btn btn-outline-primary rounded-pill fw-bold py-2 px-3"
          [class.active]="selectedEra === ''">
          전체
        </button>
      </div>
    </div>
  </div>
</div>

<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <title>이미지 자르기</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet" />
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            background: #fff;
        }

        .crop-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        img {
            max-width: 100%;
            max-height: 400px;
        }

        .buttons {
            margin-top: 20px;
        }

        button {
            margin: 0 5px;
            padding: 8px 16px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-complete {
            background-color: #5a3d00;
            color: white;
        }

        .btn-cancel {
            background-color: #ccc;
        }
    </style>
</head>

<body>
    <div class="crop-wrapper">
        <h2>이미지 자르기</h2>
        <img id="image" />
        <div class="buttons">
            <button class="btn-complete" onclick="sendCroppedImage()">완료</button>
            <button class="btn-cancel" onclick="window.close()">취소</button>
        </div>
    </div>

    <!-- ✅ cropper.js CDN 추가 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const imageBase64 = params.get('image');
        const image = document.getElementById('image');
        let cropper;

        image.src = imageBase64;

        image.onload = () => {
            cropper = new Cropper(image, {
                aspectRatio: 1,
                viewMode: 1,
            });
        };

        function sendCroppedImage() {
            if (!cropper) return;

            const canvas = cropper.getCroppedCanvas();
            const croppedImage = canvas.toDataURL('image/png');
            window.opener.postMessage({ croppedImage }, '*');
            window.close();
        }
    </script>
</body>

</html>

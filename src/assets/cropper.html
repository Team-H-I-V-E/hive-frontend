<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <title>이미지 자르기</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet" />
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            background: #fff;
        }

        .crop-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        img {
            max-width: 100%;
            max-height: 400px;
        }

        .buttons {
            margin-top: 20px;
        }

        button {
            margin: 0 5px;
            padding: 8px 16px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-complete {
            background-color: #5a3d00;
            color: white;
        }

        .btn-cancel {
            background-color: #ccc;
        }
    </style>
</head>

<body>
    <div class="crop-wrapper">
        <img id="image" />
        <div class="buttons">
            <button class="btn-complete" onclick="sendCroppedImage()">완료</button>
            <button class="btn-cancel" onclick="window.close()">취소</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script>
        const image = document.getElementById('image');
        let cropper;

        // ✅ 부모 창에게 준비되었음을 알림
        window.opener?.postMessage('ready', window.origin);

        // ✅ 부모 창으로부터 이미지 base64 수신
        window.addEventListener('message', (event) => {
            if (event.origin !== window.origin) return;

            const base64 = event.data.image;
            if (!base64) return;

            image.src = base64;

            image.onload = () => {
                cropper = new Cropper(image, {
                    aspectRatio: 4 / 3,
                    viewMode: 1,
                    dragMode: 'move',
                    movable: true,
                    zoomable: true,
                    scalable: false,
                    cropBoxMovable: false,
                    cropBoxResizable: false,
                    background: false,
                    autoCropArea: 1.0
                });
            };
        });

        function sendCroppedImage() {
            if (!cropper) return;

            const canvas = cropper.getCroppedCanvas();
            const croppedImage = canvas.toDataURL('image/png');
            window.opener.postMessage({ croppedImage }, window.origin);
            window.close();
        }
    </script>
</body>

</html>

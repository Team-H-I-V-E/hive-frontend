<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <title>이미지 자르기</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Cropper.js CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet" />
</head>

<body style="font-family: sans-serif; background: #f8f9fa; padding: 2rem;">
    <div class="container text-center">
        <h3 class="mb-4">이미지 자르기</h3>

        <!-- 고정 크기 이미지 래퍼 -->
        <div class="mx-auto mb-4" style="width: 500px; height: 375px; position: relative;">
            <img id="image" class="position-absolute top-0 start-0" alt="자르기 이미지"
                style="width: 100%; height: 100%; max-width: none; border-radius: 0.5rem; box-shadow: 0 0 10px rgba(0,0,0,0.1);" />
        </div>

        <!-- 버튼 영역 -->
        <div class="d-flex justify-content-center gap-3">
            <button class="btn btn-dark px-4" onclick="sendCroppedImage()">완료</button>
            <button class="btn btn-outline-secondary px-4" onclick="window.close()">취소</button>
        </div>
    </div>

    <!-- Cropper.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <script>
        const image = document.getElementById('image');
        let cropper;

        window.opener?.postMessage('ready', window.origin);

        window.addEventListener('message', (event) => {
            if (event.origin !== window.origin) return;

            const base64 = event.data.image;
            if (!base64) return;

            image.src = base64;

            image.onload = () => {
                cropper = new Cropper(image, {
                    aspectRatio: 4 / 3,
                    viewMode: 1,
                    dragMode: 'move',
                    movable: true,
                    zoomable: true,
                    scalable: false,
                    cropBoxMovable: false,
                    cropBoxResizable: false,
                    background: false,
                    autoCropArea: 1.0,
                    ready() {
                        cropper.setCropBoxData({
                            width: 500,
                            height: 375
                        });
                    }
                });
            };
        });

        function sendCroppedImage() {
            if (!cropper) return;

            const canvas = cropper.getCroppedCanvas();
            const croppedImage = canvas.toDataURL('image/png');
            window.opener.postMessage({ croppedImage }, window.origin);
            window.close();
        }
    </script>
</body>

</html>
